# The hooks run the ruff that requirements-dev.txt locks into the venv, the same
# binary make check runs. Run make venv before make pre-commit.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: venv/bin/ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: venv/bin/ruff format
        language: system
        types_or: [python, pyi]
